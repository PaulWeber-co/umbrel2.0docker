# Builds the umbrelOS container image the XPS runs (xps-homeserver/deploy/
# compose.yaml) whenever Umbrel's code changes, and pushes it to GHCR as
#   ghcr.io/<owner>/xps-homeserver-umbrelos:branch-<branch>   (moves along)
#   ghcr.io/<owner>/xps-homeserver-umbrelos:sha-<commit>      (fixed)
# update-umbrel.sh on the XPS pulls branch-<branch> and pins its digest.
name: XPS Umbrel container image

on:
  push:
    paths:
      - 'packages/**'
      - '.github/workflows/xps-umbrel-image.yml'
      - 'xps-homeserver/scripts/**'
      - 'xps-homeserver/deploy/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: xps-umbrel-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build XPS container image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out fork
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push amd64 container variant
        id: image
        run: |
          # Image names must be lowercase, GitHub owners need not be
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/xps-homeserver-umbrelos"
          docker buildx build \
            --platform linux/amd64 \
            --build-arg BASE_VARIANT=-container \
            --file packages/os/umbrelos.Dockerfile \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" \
            --tag "${IMAGE}:branch-${GITHUB_REF_NAME//\//-}" \
            --cache-from type=gha,scope=xps-container-amd64 \
            --cache-to type=gha,mode=max,scope=xps-container-amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=$(node -p 'require("./packages/umbreld/package.json").version')" \
            --metadata-file /tmp/xps-build.json \
            --push \
            .
          DIGEST=$(jq -r '."containerimage.digest"' /tmp/xps-build.json)
          echo "image=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Validate host code
        run: sudo python3 -m unittest discover -s xps-homeserver/scripts/tests
      - name: Validate actual candidate packages
        env:
          XPS_TEST_IMAGE: ${{ steps.image.outputs.image }}
        run: python3 -m unittest discover -s xps-homeserver/scripts/tests -p test_container_security.py
      - name: Validate isolated update and recovery lifecycle
        env:
          CANDIDATE: ${{ steps.image.outputs.image }}
        run: bash xps-homeserver/scripts/tests/container-update-smoke.sh "$CANDIDATE"
      - name: Record successful candidate evidence
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          version=json.loads(pathlib.Path('packages/umbreld/package.json').read_text())['version']
          pathlib.Path('candidate-validation.json').write_text(json.dumps(dict(
              image=os.environ['IMAGE'], sourceCommit=os.environ['GITHUB_SHA'], version=version,
              securityPassed=True, lifecyclePassed=True)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xps-candidate-validation
          path: candidate-validation.json
