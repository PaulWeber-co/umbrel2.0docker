// AirPlay 2 receiver "XPS Lautsprecher" on the XPS headphone jack.
// Metadata (title, artist, cover, progress) goes into a named pipe that the
// dashboard reads (dashboard/server/sources/shairport.js); xps-airplay.service
// creates the pipe before the container starts.
general =
{
  name = "XPS Lautsprecher";
  output_backend = "alsa";
};

alsa =
{
  output_device = "default";
};

metadata =
{
  enabled = "yes";
  include_cover_art = "yes";
  cover_art_cache_directory = "";
  pipe_name = "/run/shairport-sync/metadata";
  pipe_timeout = 5000;
  progress_interval = 1.0;
};
