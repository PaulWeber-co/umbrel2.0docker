# The XPS speakers: AirPlay 2 (shairport-sync) and Spotify Connect
# (go-librespot), both "XPS Lautsprecher" on the headphone jack. Both need the
# host network for discovery (and AirPlay 2 for PTP via nqptp in the image).
# They use the XPS's own avahi-daemon instead of starting another one, so
# xps.local and umbrel.local stay unique on the network. One switch in the
# control center (xps-airplay.service) starts and stops both.
name: xps-airplay

services:
  shairport-sync:
    image: mikebrady/shairport-sync:5.5.2
    container_name: xps-airplay
    network_mode: host
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    devices:
      - /dev/snd:/dev/snd
    environment:
      ENABLE_AVAHI: "0"
    volumes:
      - ./shairport-sync.conf:/etc/shairport-sync.conf:ro
      - /run/shairport-sync:/run/shairport-sync
      - /var/run/dbus:/var/run/dbus
      - /var/run/avahi-daemon:/var/run/avahi-daemon
    logging:
      options:
        max-size: "200k"
        max-file: "5"

  spotify:
    image: ghcr.io/devgianlu/go-librespot:v0.10.5
    container_name: xps-spotify
    network_mode: host
    restart: unless-stopped
    # Needs nothing but the sound card, D-Bus for avahi and its own folder
    read_only: true
    # Its own user (setup-xps.sh, with the audio group for the sound card), not
    # root: whoever is root on the system D-Bus, which avahi needs, can have
    # systemd run anything. xps-airplay.service reads the IDs from spotify.env.
    user: "${XPS_SPOTIFY_USER:?fehlt in /etc/xps-homeserver/spotify.env, bitte sudo update-xps}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - /var/lib/xps-spotify:/config
      - /var/run/dbus:/var/run/dbus
    tmpfs:
      - /tmp
    logging:
      options:
        max-size: "200k"
        max-file: "5"
