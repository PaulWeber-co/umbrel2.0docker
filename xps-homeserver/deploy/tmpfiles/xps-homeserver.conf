# Runtime paths the XPS services share, created at every boot before any of
# them starts (installed to /etc/tmpfiles.d/ by scripts/setup-xps.sh).
#
# The AirPlay metadata pipe: shairport-sync writes, the dashboard reads. It
# has to exist even while AirPlay is switched off, because xps-dashboard
# lists the directory in ReadWritePaths=.
d /run/shairport-sync 0755 root root -
p /run/shairport-sync/metadata 0662 root xps-dashboard -
