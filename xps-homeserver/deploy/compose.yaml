name: xps-homeserver

services:
  umbrel:
    image: ${XPS_UMBREL_IMAGE:?Run xps-homeserver/scripts/install-umbrel.sh first}
    container_name: umbrel
    hostname: umbrel
    privileged: true
    cgroup: private
    command: /sbin/init
    stop_signal: SIGRTMIN+3
    stop_grace_period: 5m
    tty: true
    restart: unless-stopped
    volumes:
      - umbrel-data:/data
    tmpfs:
      - /run
      - /run/lock
    ports:
      - ${UMBREL_PUBLISH_ADDRESS:-0.0.0.0}:${UMBREL_HTTP_PORT:-80}:80
      - ${UMBREL_PUBLISH_ADDRESS:-0.0.0.0}:${UMBREL_HTTPS_PORT:-443}:443
      - ${UMBREL_PUBLISH_ADDRESS:-0.0.0.0}:2000:2000
    healthcheck:
      test: ["CMD-SHELL", "systemctl is-active --quiet docker umbrel && curl --silent --fail --output /dev/null http://localhost"]
      interval: 30s
      timeout: 10s
      start_period: 5m
      retries: 3
    labels:
      dev.orbstack.domains: umbrel.local
      dev.orbstack.http-port: "80"

  port-publisher:
    image: ${XPS_UMBREL_IMAGE:?Run xps-homeserver/scripts/install-umbrel.sh first}
    container_name: umbrel-port-publisher
    depends_on:
      umbrel:
        condition: service_healthy
    entrypoint: /usr/local/bin/umbrel-port-publisher
    init: true
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      UMBREL_CONTAINER: umbrel
      UMBREL_PUBLISH_ADDRESS: ${UMBREL_PUBLISH_ADDRESS:-0.0.0.0}
      UMBREL_PUBLISH_EXCLUDE: ${UMBREL_PUBLISH_EXCLUDE:-22,7777}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  umbrel-data:
