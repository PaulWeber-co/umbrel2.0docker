<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>XPS Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@200;300;400;500;600&display=swap">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/w-server.css">
  <link rel="stylesheet" href="/css/w-tiles.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <!-- Icons: <svg class="ic"><use href="#i-NAME"/></svg>, helper icon(NAME) in js/util.js -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <defs>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M2.5 12h2M19.5 12h2M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
      <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 19h10.5a4.5 4.5 0 0 0 .4-8.98A6.5 6.5 0 0 0 5.4 11.2 4 4 0 0 0 7 19z"/></symbol>
      <symbol id="i-cloudsun" viewBox="0 0 24 24"><path d="M8.5 2.8v1.6M3.4 5l1.1 1.1M1.8 10.3h1.6M13.6 5l-1.1 1.1"/><path d="M5.2 12.6a3.6 3.6 0 1 1 6.6-3.3"/><path d="M9.5 20.5h8a3.8 3.8 0 0 0 .3-7.6 5.3 5.3 0 0 0-10.1 1.6 3 3 0 0 0 1.8 6z"/></symbol>
      <symbol id="i-rain" viewBox="0 0 24 24"><path d="M7 15h10.5a4.5 4.5 0 0 0 .4-8.98A6.5 6.5 0 0 0 5.4 7.2 4 4 0 0 0 7 15z"/><path d="M8.5 18l-1 3M12.5 18l-1 3M16.5 18l-1 3"/></symbol>
      <symbol id="i-snow" viewBox="0 0 24 24"><path d="M7 15h10.5a4.5 4.5 0 0 0 .4-8.98A6.5 6.5 0 0 0 5.4 7.2 4 4 0 0 0 7 15z"/><path d="M8 18.5h.01M12 20h.01M16 18.5h.01M10 21.5h.01M14 21.5h.01"/></symbol>
      <symbol id="i-storm" viewBox="0 0 24 24"><path d="M7 15h10.5a4.5 4.5 0 0 0 .4-8.98A6.5 6.5 0 0 0 5.4 7.2 4 4 0 0 0 7 15z"/><path d="M12.5 14l-2 4h3l-2 4"/></symbol>
      <symbol id="i-fog" viewBox="0 0 24 24"><path d="M4 9h16M3 13h18M5 17h14M8 21h8"/></symbol>
      <symbol id="i-car" viewBox="0 0 24 24"><path d="M4.5 17h15v-4.6l-1.9-4.8A2 2 0 0 0 15.7 6.3H8.3a2 2 0 0 0-1.9 1.3L4.5 12.4z"/><path d="M4.5 12.4h15M7.5 14.8h1.5M15 14.8h1.5M6.3 17v2.2M17.7 17v2.2"/></symbol>
      <symbol id="i-train" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="14" rx="3"/><path d="M6 11h12M9 21l1.5-4M15 21l-1.5-4M9 14h.5M14.5 14h.5"/></symbol>
      <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.8 6l1.2 1.2 2-2.4M3.8 12l1.2 1.2 2-2.4"/><path d="M4.5 18h1.5"/></symbol>
      <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 2.5V6M15 2.5V6M9 18v3.5M15 18v3.5M2.5 9H6M2.5 15H6M18 9h3.5M18 15h3.5"/></symbol>
      <symbol id="i-temp" viewBox="0 0 24 24"><path d="M14 14.8V5a2 2 0 0 0-4 0v9.8a4 4 0 1 0 4 0z"/></symbol>
      <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5.2-5.2L7 19.5"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 11L12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/></symbol>
      <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.3 1 2.2h5.2c0-.9.4-1.7 1-2.2A6 6 0 0 0 12 3z"/></symbol>
      <symbol id="i-washer" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2.5"/><circle cx="12" cy="13" r="4.5"/><path d="M7.5 6.5h2"/></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V5.5l11-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></symbol>
      <symbol id="i-trend" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h8M16 6h4M4 12h3M11 12h9M4 18h6M14 18h6"/><circle cx="14" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="12" cy="18" r="2"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-airplay" viewBox="0 0 24 24"><path d="M6 17H4.5A1.5 1.5 0 0 1 3 15.5v-10A1.5 1.5 0 0 1 4.5 4h15A1.5 1.5 0 0 1 21 5.5v10a1.5 1.5 0 0 1-1.5 1.5H18"/><path d="M12 14l5 6H7z"/></symbol>
      <symbol id="i-work" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V4h8v3M3 12h18M10 12v2h4v-2"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="M3 3l18 18M8.5 16.4a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 4.4-2.6M19 12.9a10 10 0 0 0-2.3-1.7M2 9.3a15 15 0 0 1 4.3-2.7M22 9.3A15 15 0 0 0 11 5.1M12 20h.01"/></symbol>
    </defs>
  </svg>

  <main class="screen" id="screen">
    <div class="frame">
      <div class="stage" id="stage" data-scene="tag" data-music="0" data-edit="0">
        <div class="bg">
          <video id="v1" muted playsinline loop preload="auto" aria-hidden="true"></video>
          <video id="v2" muted playsinline loop preload="auto" aria-hidden="true"></video>
          <div class="layer tint"></div>
          <div class="layer glow"></div>
        </div>

        <section class="dash" aria-label="Dashboard">
          <div class="scrim"></div>
          <header class="head">
            <div class="greet" id="greet">Hallo</div>
            <div class="time js-time">--:--</div>
            <div class="date js-date"></div>
          </header>
          <div id="tiles"></div>

          <div class="player" id="player" aria-label="Läuft gerade">
            <img class="cover" id="cover" alt="" width="440" height="440">
            <div class="pinfo">
              <div class="eyebrow"><svg class="ic"><use href="#i-airplay"/></svg>Läuft auf XPS Lautsprecher</div>
              <div class="ptitle" id="ptitle"></div>
              <div class="partist" id="partist"></div>
              <div class="palbum" id="palbum"></div>
              <div class="prog"><div class="bar"><i id="pbar"></i></div><div class="times"><span id="ppos">0:00</span><span id="pdur">0:00</span></div></div>
            </div>
          </div>
        </section>

        <div class="night" aria-label="Nachtansicht">
          <div class="n-time js-time">--:--</div>
          <div class="n-date js-date"></div>
        </div>

        <div class="layer warm" aria-hidden="true"></div>

        <div class="status">
          <span class="chip" id="chip-offline"><svg class="ic"><use href="#i-wifi-off"/></svg>Keine Verbindung zum Server</span>
        </div>

        <div class="glass-settings-overlay" id="glass-settings-overlay" hidden>
          <section class="glass-settings" id="glass-settings" role="dialog" aria-modal="true" aria-labelledby="glass-settings-title">
            <div class="glass-settings-head">
              <div>
                <h2 id="glass-settings-title">Glas-Effekt</h2>
                <p>Dashboard-Kacheln und Musikansicht</p>
              </div>
              <button class="glass-settings-close" type="button" id="glass-settings-close" aria-label="Einstellungen schließen"><svg class="ic"><use href="#i-x"/></svg></button>
            </div>
            <label class="glass-settings-label" for="glass-level">Transparenz</label>
            <div class="glass-range-row">
              <span class="glass-edge">Klar</span>
              <input id="glass-level" type="range" min="0" max="100" step="1" value="55" aria-label="Glas-Effekt von klar bis milchig">
              <span class="glass-edge">Milchig</span>
            </div>
            <p class="glass-settings-note">Die Einstellung gilt für alle Dashboard-Browser und den XPS-Kiosk.</p>
          </section>
        </div>
        <button class="glass-settings-toggle" id="glass-settings-toggle" type="button" aria-label="Glas-Einstellungen öffnen" aria-controls="glass-settings" aria-expanded="false">
          <svg class="ic"><use href="#i-sliders"/></svg>
        </button>

        <div class="editbar" role="toolbar" aria-label="Widgets bearbeiten">
          <span>Auf gleich große Kachel ziehen zum Tauschen, × zum Entfernen</span>
          <span class="add" id="add-list"></span>
          <button class="done" type="button" id="btn-done">Fertig</button>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
