#_preseed_V1
# Automatic Debian 13 installation for the XPS homeserver. Works without any
# network: everything beyond the base system comes from /xps on the stick.
# The double-at placeholders are filled in by installer/container/build-iso.sh.

### Language, keyboard, time
d-i debian-installer/locale string @@LOCALE@@
d-i keyboard-configuration/xkb-keymap select @@KEYMAP@@
d-i clock-setup/utc boolean true
d-i time/zone string @@TIMEZONE@@
d-i clock-setup/ntp boolean false

### Network: none during installation. Wi-Fi is set up by /xps/target-setup.sh
d-i netcfg/enable boolean false
d-i netcfg/get_hostname string @@HOSTNAME@@
d-i netcfg/get_domain string
d-i netcfg/hostname string @@HOSTNAME@@
d-i hw-detect/load_firmware boolean true

### Packages: only what is on the stick
d-i apt-setup/no_mirror boolean true
d-i apt-setup/use_mirror boolean false
d-i apt-setup/non-free boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/services-select multiselect
d-i apt-setup/disable-cdrom-entries boolean true
d-i base-installer/kernel/image string linux-image-amd64
tasksel tasksel/first multiselect
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/include string
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

### Account: no root login, the user gets sudo
d-i passwd/root-login boolean false
d-i passwd/user-fullname string @@FULLNAME@@
d-i passwd/username string @@USER@@
d-i passwd/user-password-crypted password @@PASSWORD_HASH@@
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

### Disk: the whole internal SSD, picked by /xps/pick-disk.sh so the USB
### stick is never touched. EFI partition plus one ext4 root, no swap
### partition (zram and a swap file come later).
d-i partman/early_command string sh /cdrom/xps/pick-disk.sh
d-i partman-auto/method string regular
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman-auto/expert_recipe string \
      xps :: \
              538 538 1075 free \
                      $iflabel{ gpt } \
                      $reusemethod{ } \
                      method{ efi } \
                      format{ } \
              . \
              10000 20000 -1 ext4 \
                      method{ format } format{ } \
                      use_filesystem{ } filesystem{ ext4 } \
                      mountpoint{ / } \
              .
d-i partman-auto/choose_recipe select xps
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/force-efi-extra-removable boolean true

### Wi-Fi driver, Wi-Fi, SSH, mDNS
d-i preseed/late_command string sh /cdrom/xps/late.sh

### Done: reboot on its own
d-i cdrom-detect/eject boolean false
d-i finish-install/reboot_in_progress note
