menuentry 'XPS automatisch installieren  (löscht die interne SSD!)' {
    set background_color=black
    linux    /install.amd/vmlinuz auto=true priority=critical preseed/file=/cdrom/preseed.cfg locale=@@LOCALE@@ keymap=@@KEYMAP@@ hostname=@@HOSTNAME@@ domain= vga=788 @@KERNEL_EXTRA@@ --- quiet
    initrd   /install.amd/initrd.gz
}
